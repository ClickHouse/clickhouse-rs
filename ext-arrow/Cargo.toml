[package]
name = "clickhouse-ext-arrow"
version = "0.2.0"
authors = ["ClickHouse Contributors"]
description = "Adds support for Apache Arrow to the official ClickHouse client"
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# We depend on the constituent crates rather than the `arrow` crate directly so that we only pull in the code
# we need to compile. The versions here should match the `arrow` crate.
arrow-array = { version = "59" }
arrow-buffer = { version = "59" }
arrow-ipc = { version = "59" }
arrow-schema = { version = "59" }
arrow-select = { version = "59" }

tokio = "1"
tracing = "0.1"

[dependencies.clickhouse]
# TODO: raise to the first `clickhouse` release that has `BytesCursor::query_id()` before publishing this crate.
# 0.15.3 does not have it: https://github.com/ClickHouse/clickhouse-rs/issues/522
version = "0.15.3"
path = ".."
