disallowed-macros = [
    # https://github.com/tokio-rs/tracing/issues/2448
    "tracing::enabled"
]

# https://github.com/ClickHouse/clickhouse-rs/issues/469
[[disallowed-methods]]
path = "clickhouse::Client::with_product_info"
reason = "will place product info at front of user agent string, ahead of the app's product info"
replacement = "with_stack_product_info"

[[disallowed-methods]]
path = "clickhouse::query::Query::with_product_info"
reason = "will place product info at front of user agent string, ahead of the app's product info"
replacement = "with_stack_product_info"

[[disallowed-methods]]
path = "clickhouse::insert_formatted::InsertFormatted::with_product_info"
reason = "will place product info at front of user agent string, ahead of the app's product info"
replacement = "with_stack_product_info"
